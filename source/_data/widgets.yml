welcome:
  layout: markdown
  title: 欢迎，旅行者
  linklist: # 与 linklist 组件写法相同
  columns: 1 
  items: # 复刻 xaoxuu 的「备用站 / 交流区」
    - icon:
      title: 关于
      url: /about/
    - icon:
      title: 友链
      url: /friends/
  content: 
    您已来到世界边缘，喜欢的话欢迎评论区交流吧～ 这是 J. Tech.，一个记录 AI Agent 系统设计、深度学习与工程实践的站点。
  src: # 可以设置外部 md 文件链接

toc:
  layout: toc
  list_number: false # 是否显示序号
  min_depth: 2 # 建议不要低于 2 即从 H2 标签开始解析（H1标签用于文章大标题）
  max_depth: 5 # 5 代表最多解析到 H5 标签
  fallback: welcome # Use a backup widget when toc does not exist.
  collapse: false # true / false / auto (始终折叠/不折叠/自动折叠)

recent:
  layout: recent
  rss: # /atom.xml # npm i hexo-generator-feed
  limit: 5 # Count of posts

# related:
#   layout: related

linklist:
  layout: linklist
  columns: 2
  items:
    - icon: '<svg...></svg>' # 或者 icons.yml 中设置的 icon 名称
      title: 友链
      url: /friends/
    - icon: '<svg...></svg>' # 或者 icons.yml 中设置的 icon 名称
      title: 关于
      url: /about/


ghrepo:
# Usage https://xaoxuu.com/wiki/stellar/widgets/  
  layout: ghrepo

