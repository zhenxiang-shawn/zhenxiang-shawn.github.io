  script:
    # -- Cloudflare Web Analytics 访问量统计 -- #
    - |
      <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "cab56a95bb224873816c3555012a343e"}'></script><!-- End Cloudflare Web Analytics -->
    # -- 日夜模式切换按钮逻辑：默认 auto 跟随系统，点击循环 auto / light / dark -- #
    - |
      <script>
      (function(){
        if (window.__themeToggleInited__) return;
        window.__themeToggleInited__ = true;
        var ICONS = {
          auto:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
          light: '<svg viewBox="0 0 24 24"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>',
          dark:  '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
        };
        var LABELS = { auto: '跟随系统', light: '亮色', dark: '暗色' };
        function calcState(){
          var t = localStorage.getItem('Stellar.theme');
          if (t === 'light' || t === 'dark') return t;
          return 'auto';
        }
        function apply(state, btn){
          var html = document.documentElement;
          if (state === 'light' || state === 'dark') {
            html.setAttribute('data-theme', state);
          } else {
            html.removeAttribute('data-theme');
          }
          btn && btn.setAttribute('data-state', state);
          if (btn) {
            btn.innerHTML = ICONS[state];
            btn.setAttribute('title', LABELS[state]);
          }
          var m = window.__STELLAR_I18N__;
        }
        function switchS(btn){
          var cur = calcState();
          var next = cur === 'auto' ? 'light' : (cur === 'light' ? 'dark' : 'auto');
          if (next === 'auto') localStorage.removeItem('Stellar.theme');
          else localStorage.setItem('Stellar.theme', next);
          apply(next, btn);
          if (typeof utils !== 'undefined' && utils.dark) {
            utils.dark.mode = next === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : next;
            utils.dark.method.toggle && utils.dark.method.toggle.start && utils.dark.method.toggle.start();
          }
        }
        function buildBtn(){
          var btn = document.createElement('button');
          btn.className = 'theme-toggle-btn';
          btn.type = 'button';
          btn.innerHTML = ICONS.auto;
          btn.setAttribute('aria-label', '切换日夜模式');
          btn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); switchS(btn); });
          return btn;
        }
        function mount(){
          var header = document.querySelector('.header .logo-wrap') || document.querySelector('.header');
          if (!header) return;
          var existing = document.querySelector('.theme-toggle-btn');
          if (existing) { existing.remove(); }
          var btn = buildBtn();
          var state = calcState();
          btn.setAttribute('data-state', state);
          btn.querySelector('.ttb-' + state) && (btn.querySelector('.ttb-' + state).style.display = 'none');
          // 使用 ICONS 直接构建：带三个分支子元素改用 title
          btn.innerHTML = ICONS[state];
          btn.setAttribute('title', LABELS[state]);
          header.appendChild(btn);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', mount);
        } else {
          mount();
        }
      })();
      </script>

style:
  # 日/夜模式：auto = 跟随系统
  prefers_theme: auto
  color:
    # ===== 复刻 xaoxuu.com 青色视觉基调（cyan hue=192，取自 xaoxuu 主题默认色）=====
    theme: '#0fb1cc' # 主题/品牌色（青色）
    accent: '#0b7f9a' # 强调色（深青）
    link: '#0b7f9a'   # 超链接
  # 侧边栏（左侧栏）样式：纯色卡片，保持干净通透的青色视觉
  leftbar:
    ui-style: card
    background-color-light: var(--card)
    background-color-dark: var(--card)
    blur-px: 100px
    blur-bg: var(--bg-a60)
  border-radius:
    card-l: 24px # 大卡片、侧边栏、专辑横幅
    card: 16px   # 文章内卡片
    card-s: 12px # 文章内小型卡片
    bar: 12px    # 横条类元素
  font-size:
    root: 16px
    code: 85% # 14px
    codeblock: 0.8125rem # 13px
  font-family:
    body: '"LXGW WenKai Screen", "PingFang SC", system-ui, "Microsoft Yahei", "Segoe UI", -apple-system, Roboto, "Helvetica Neue", "Noto Sans SC", sans-serif'
    code: 'Menlo, Monaco, Consolas, "SF Mono", "JetBrains Mono", monospace, sans-serif'
    codeblock: 'Menlo, Monaco, Consolas, "SF Mono", "JetBrains Mono", monospace, sans-serif'

menubar:
  columns: 3 # 一行多少个
  items: # 可按照自己需求增加，符合以下格式即可
    - id: post # 页面中高亮的 menu_id
      theme: '#0fb1cc' # 高亮时的颜色，仅 svg 中 fill="currentColor" 时有效
      icon: default:documents
      title: 博客 # 标题
      url: / # 跳转链接，支持相对路径和绝对路径
    - id: wiki
      theme: '#0b7f9a'
      icon: default:category
      title: 项目
      url: /wiki/
    - id: social
      theme: '#0c8c9e'
      icon: github:logo
      title: 友链
      url: /friends/
    - id: about
      theme: '#0e9db6'
      icon: default:monitor
      title: 关于
      url: /about/

site_tree:
