    # -- 视觉升级：暗色模式下链接保持 AA 对比度的极简覆盖（青色-300） -- #
    - |
      <style>
      @media (prefers-color-scheme: dark){
        :root{
          --theme-link: #24c6e0;
        }
      }
      .tech-cards{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }
      .tech-cards a{
        display: block;
        width: 360px;
        max-width: 100%;
        text-align: center;
      }
      .tech-cards img{
        width: 360px;
        max-width: 100%;
        height: auto;
        display: inline-block;
        margin: 0 auto;
      }
      /* -- MBTI 人格卡片 -- #
      # 配色均溯源至 xaoxuu 青色主题：条形填充 #0fb1cc（青色），文字 #2b3134（正文色），
      # 强调 #0b7f9a（深青，浅底对比通过 AA） #
      # -- */
      .mbti-card{
        border: 1px solid rgba(15,177,204,0.28);
        border-radius: 14px;
        padding: 1.4rem 1.5rem;
        background: var(--theme-block);
        margin: 1rem 0;
      }
      .mbti-head{
        display: flex;
        align-items: baseline;
        gap: .75rem;
        flex-wrap: wrap;
      }
      .mbti-type{
        font-size: 1.7rem;
        font-weight: 700;
        color: var(--theme, #0fb1cc);
        letter-spacing: .5px;
      }
      .mbti-name{
        font-size: 1rem;
        color: var(--text-p1, #2b3134);
      }
      .mbti-dims{
        display: grid;
        gap: 1rem;
        margin-top: 1.2rem;
      }
      .mbti-key{
        font-size: .88rem;
        color: var(--text-p1, #2b3134);
        font-weight: 600;
      }
      .mbti-sub{
        font-size: .75rem;
        color: var(--text-p2, #4a5658);
        font-weight: 400;
      }
      .mbti-val{
        float: right;
        font-size: .88rem;
        color: var(--theme, #0fb1cc);
        font-weight: 700;
      }
      .mbti-bar{
        height: 8px;
        background: color-mix(in srgb, var(--theme, #0fb1cc) 18%, transparent);
        border-radius: 4px;
        margin-top: 5px;
        overflow: hidden;
      }
      .mbti-bar i{
        display: block;
        height: 100%;
        background: var(--theme, #0fb1cc);
        border-radius: 4px;
      }
      .mbti-link{
        display: inline-block;
        margin-top: 1.1rem;
        font-size: .86rem;
        color: var(--theme, #0b7f9a);
        text-decoration: none;
      }
      .mbti-link:hover{
        text-decoration: underline;
      }
      /* -- 日夜模式切换按钮（xcute 青色主题风格，复用主题 data-theme / Stellar.theme 机制） -- #
      # 默认 auto 跟随系统；点击循环 auto -> light -> dark。
      # 配色溯源：#0fb1cc 青色主题、#ffffff 按钮底面、文字跟随主题正文色 var(--text-p1)。 #
      # -- */
      .theme-toggle-btn{
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        border: 1px solid var(--theme-ga, rgba(11,127,154,0.22));
        background: var(--card, #fff);
        color: var(--text-p1, #2b3134);
        cursor: pointer;
        margin-left: auto;
        transition: all .2s ease;
        flex-shrink: 0;
      }
      .theme-toggle-btn:hover{
        border-color: #0fb1cc;
        color: #0fb1cc;
      }
      .theme-toggle-btn svg{
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .theme-toggle-btn .ttb-auto{ display: none; }
      .theme-toggle-btn .ttb-light{ display: none; }
      .theme-toggle-btn .ttb-dark{ display: none; }
      .theme-toggle-btn[data-state="auto"]  .ttb-auto{ display: block; }
      .theme-toggle-btn[data-state="light"] .ttb-light{ display: block; }
      .theme-toggle-btn[data-state="dark"]  .ttb-dark{ display: block; }
      .theme-toggle-btn[title]:after{
        content: attr(title);
        position: absolute;
        top: -30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(30,30,30,.85);
        color: #fff;
        font-size: 11px;
        padding: 3px 7px;
        border-radius: 6px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity .15s;
      }
      .theme-toggle-btn:hover[title]:after{ opacity: 1; }
      .theme-toggle-btn{ position: relative; }
      </style>
