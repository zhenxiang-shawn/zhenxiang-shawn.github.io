  home:
    leftbar: welcome, recent
    rightbar:
  # 博客列表页配置
  index_blog:
    base_dir: blog # 只影响自动生成的页面路径
    menu_id: post # 未在 front-matter 中指定 menu_id 时，layout 为 post 的页面默认使用这里配置的 menu_id
    leftbar: welcome, recent # for categories/tags/archives
    rightbar:
  # 文档列表页配置
  index_wiki:
    base_dir: wiki
    menu_id: wiki
    leftbar: toc, recent # for wiki
    rightbar:
    nav_tabs:
      'Github': https://github.com/zhenxiang-shawn
  # 博客文章内页配置
  post:
    menu_id: post
    leftbar: welcome, recent
    rightbar: toc, ghrepo
  # 文档内页配置
  wiki:
    menu_id: wiki
    leftbar: welcome, recent
    rightbar: ghrepo, toc
  # 关于页配置
